{% extends "base.html" %}
{% block title %}Edit Task - Student Task Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Edit Task</h3>
        <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}" novalidate>
          <div class="mb-3">
            <label for="task_title" class="form-label">Title</label>
            <input type="text" class="form-control" id="task_title" name="task_title" maxlength="100"
                   value="{{ task.task_title or '' }}" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" maxlength="500">{{ task.description or '' }}</textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="due_date" class="form-label">Due date</label>
              <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date or '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" name="status">
                <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Update Task</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
